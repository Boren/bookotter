[project]
name = "bookotter"
version = "0.1.0"
description = "Automatically transfer books from Readarr to Kindle based on Hardcover reading lists"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [
    { name = "Fredrik Bore" }
]
keywords = ["kindle", "readarr", "hardcover", "ebook", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]

dependencies = [
    # Core dependencies
    "requests>=2.33.0",
    "PyYAML>=6.0.3",
    "paramiko>=4.0.0",
    "python-Levenshtein>=0.27.0",
    "fuzzywuzzy>=0.18.0",
    "rich>=14.0.0",
    # Web framework
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.44.0",
    # Database
    "sqlalchemy>=2.0.49",
    # Scheduling
    "apscheduler>=3.11.0",
    # File handling
    "aiofiles>=25.0.0",
    "python-multipart>=0.0.24",
]

[project.urls]
Homepage = "https://github.com/Boren/bookotter"
Repository = "https://github.com/Boren/bookotter"
Issues = "https://github.com/Boren/bookotter/issues"

[project.scripts]
bookotter = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "mypy>=1.20.0",
]

[project]
name = "bookotter"
version = "0.1.0"
description = "Automatically sync books from Hardcover reading lists to Kindle via Prowlarr + qBittorrent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [
    { name = "Fredrik Bore" }
]
keywords = ["kindle", "prowlarr", "qbittorrent", "hardcover", "ebook", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]

dependencies = [
    # Core dependencies
    "requests>=2.33.1",
    "PyYAML>=6.0.3",
    "paramiko>=4.0.0",
    "python-Levenshtein>=0.27.3",
    "fuzzywuzzy>=0.18.0",
    "rich>=15.0.0",
    # Web framework
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    # Database
    "sqlalchemy>=2.0.49",
    # Scheduling
    "apscheduler>=3.11.2",
    # File handling
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.27",
    # EPUB handling
    "ebooklib>=0.20",
]

[project.urls]
Homepage = "https://github.com/Boren/bookotter"
Repository = "https://github.com/Boren/bookotter"
Issues = "https://github.com/Boren/bookotter/issues"

[project.scripts]
bookotter = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.20.2",
    "freezegun>=1.5.0",
]
